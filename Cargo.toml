[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/providers",
    "crates/storage",
    "crates/render",
    "crates/sibyl",
    "crates/app-core",
]
# The Tauri desktop shell builds separately (needs system webkit2gtk libraries);
# excluded so the headless core test suite stays toolchain-light.
exclude = ["src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
async-trait = "0.1"
thiserror = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

# Local crates
domain = { path = "crates/domain" }
providers = { path = "crates/providers" }
storage = { path = "crates/storage" }
render = { path = "crates/render" }
